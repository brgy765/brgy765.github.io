<!DOCTYPE html>
<html>
  <head>
    <title>Barangay Records</title>
    <style>
      body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        text-align:center;
        margin:0;
        padding:20px;
      }
      .container{
        max-width:500px;
        margin:auto;
      }
      .navbar{
        background:#333;
        padding:10px;
        margin-bottom:20px;
      }
      .navbar a{
        color:white;
        text-decoration:none;
        margin:0 3px;
        font-weight:bold;
      }
      .navbar a:hover{
        text-decoration:underline;
      }
      .button{
        display:block;
        background:#0078D7;
        color:white;
        text-decoration:none;
        padding:15px;
        margin:10px 0;
        border-radius:10px;
        font-weight:bold;
      }
      .button:hover{
        background:#005ea6;
      }
      #year2018{
        margin-left:30px;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
        | 
      <a href="index.html">🏠 Home</a> | 
      <a href="services.html">📄 Services</a> | 
      <a href="events.html">📅 Events</a> | 
      <a href="records.html">📂 Records</a> | 
      <a href="subscribe.html">🔔Updates</a> | 
    </div>
    <div class="container">
      <h1>📂 Barangay Records</h1>
      <button class="button" onclick="toggleCOA()">📊 COA Reports</button>
      <div id="coaSection" style="display:none;">
        <button class="button" onclick="toggle2018()">📁 2018</button>
          <div id="year2018" style="display:none;">
            <p><a class="button" href="">📄 View Report</a></p>
          </div>
        <p><a class="button" href="">📁 2019</a></p>
        <p><a class="button" href="">📁 2020</a></p>
        <p><a class="button" href="">📁 2021</a></p>
        <p><a class="button" href="">📁 2022</a></p>
        <p><a class="button" href="">📁 2023</a></p>
        <p><a class="button" href="">📁 2024</a></p>
        <p><a class="button" href="">📁 2025</a></p>
        <p><a class="button" href="">📁 2026</a></p>
      </div>
      <p><a class="button" href="">💰 Budget Reports</a></p>
      <p><a class="button" href="">🧾 Ordinances</a></p>
      <p><a class="button" href="">📋 Resolutions</a></p>
      <p><a class="button" href="">📜 Historical</a></p>
    </div>
    <script>
      function toggleCOA(){
        var section = document.getElementById("coaSection");
        if(section.style.display == "none"){
          section.style.display = "block";
        } else {
          section.style.display = "none";
        }
      }

      function toggle2018(){
        var section = document.getElementById("year2018");
        if(section.style.display == "none"){
          section.style.display = "block";
        } else {
          section.style.display = "none";
        }
      }
    </script>
  </body>
</html>
